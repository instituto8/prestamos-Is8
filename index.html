<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#233a85"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Equipos ISFT8"><title>ISFT8 · Préstamos y reservas de equipos</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--az:#233a85;--az2:#1a2c66;--rojo:#e3242b;--bg:#f2f5fb;--tx:#16213f;--mut:#5d6786;--ln:#d9e0f0;--ok:#1f8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{background:var(--az);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:52px}header .who{font-size:14px;text-align:right;line-height:1.3}
header button{background:none;border:0;color:#cfd8f5;text-decoration:underline;font:inherit;font-size:13px;padding:0}
main{max-width:640px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:26px;line-height:1.15;margin:6px 0 4px;font-weight:800}h2{font-size:21px;margin:4px 0 14px;font-weight:800}
p.sub{color:var(--mut);margin:0 0 18px}
.sedes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}
.sedes button{padding:14px;border-radius:14px;border:2px solid var(--ln);background:#fff;font:inherit;font-weight:800;font-size:18px;color:var(--az)}
.sedes button.on{background:var(--az);border-color:var(--az);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:2px solid var(--ln);border-radius:18px;padding:22px 10px;text-align:center;font:inherit;font-weight:800;font-size:18px;color:var(--az)}
.tile .ic{display:block;font-size:54px;margin-bottom:8px}.tile:active{background:#e8edfa}
.back{background:none;border:0;color:var(--az);font:inherit;font-weight:600;padding:6px 0;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eq{background:#fff;border:2px solid var(--ln);border-radius:16px;padding:16px 8px;text-align:center;font:inherit;color:var(--tx);position:relative}
.eq .ic{font-size:46px;display:block}.eq b{display:block;font-size:16px;margin-top:4px}.eq small{color:var(--mut);font-size:13px}
.eq.sel{border-color:var(--az);background:#e8edfa;box-shadow:0 0 0 2px var(--az)}
.eq.sel::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--az);font-weight:800;font-size:20px}
.eq:disabled{opacity:.5;background:#eceff6}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:12px 16px}
.btn{display:block;width:100%;max-width:608px;margin:0 auto;padding:17px;border:0;border-radius:14px;background:var(--rojo);color:#fff;font:inherit;font-weight:800;font-size:19px}
.btn:disabled{background:#b9c0d4}.btn.sec{background:var(--az)}.btn.small{width:auto;display:inline-block;padding:10px 16px;font-size:15px;margin:0 8px 0 0}.btn.ghost{background:#fff;color:var(--az);border:2px solid var(--az)}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.card b{font-size:18px}.card .m{color:var(--mut);font-size:14px;margin:2px 0 8px}
input,select{width:100%;padding:14px;border:2px solid var(--ln);border-radius:12px;font:inherit;background:#fff;margin:4px 0 12px}
label{font-weight:600;font-size:14px;color:var(--mut)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.docs button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:15px;margin-bottom:8px;font:inherit;font-weight:600}
.ctr{text-align:center}.ctr img{width:230px;max-width:70%;margin:10px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:none;padding:10px 14px;border-radius:20px;border:2px solid var(--ln);background:#fff;font:inherit;font-weight:600}.tabs .on{background:var(--az);color:#fff;border-color:var(--az)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#toast{position:fixed;left:16px;right:16px;bottom:92px;margin:auto;max-width:560px;padding:14px 16px;border-radius:12px;color:#fff;font-weight:600;display:none;z-index:9}
:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
.sedes.big{grid-template-columns:1fr;gap:14px}.sedes.big button{padding:26px 14px;font-size:26px;display:flex;align-items:center;justify-content:center;gap:16px}.sedes.big .ic{font-size:46px}
.portada img{width:240px;max-width:68%;margin:6px 0 2px}.sedebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:6px 14px;margin-bottom:16px;font-size:18px}.sedebar .back{margin:0}
.tsel{display:flex;align-items:center;gap:6px}.tsel select{margin:4px 0 12px}
</style></head><body>

const ic=e=>ICONOS[e.tipo!=='otro'&&ICONOS[e.tipo]?e.tipo:adivinar(e.nombre)||'otro'];
const fmt=x=>x?x.slice(8,10)+'/'+x.slice(5,7)+' '+x.slice(11,16):'';
const TIPOS=Object.keys(ICONOS);
const ADM={Docentes:['nombre','activo','clave'],Equipos:['sede','nombre','tipo','activo'],Prestamos:['sede','retiro','docente','equipo','devolucion','estado'],Reservas:['sede','fecha','inicio','fin','docente','equipo','estado']};
const S={sedes:[],docentes:[],url:'',doc:null,tok:'',sede:null,sel:new Set(),pin:'',tab:'Docentes'};
const $=s=>document.querySelector(s),app=$('#app');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const API=window.API_URL;
const rpc=(fn,...a)=>fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a})}).catch(()=>{throw new Error('Sin conexión con el servidor. Revisá tu internet.')}).then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error('No se pudo conectar con el servidor. Probá de nuevo.')}if(j.error==='SESION_INVALIDA'){cambiar();throw new Error('Tu sesión venció. Volvé a ingresar con tu contraseña.')}if(j.error)throw new Error(j.error);return j.data});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ok){const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--ok)':'#b3261e';t.style.display='block';setTimeout(()=>t.style.display='none',3800)}
const msg=e=>(e&&e.message||String(e)).replace(/^Error:\s*/,'');
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
async function run(p,okMsg,then){try{await p;if(okMsg)toast(okMsg,1);if(then)then()}catch(e){toast(msg(e))}}

const ORDEN=['Sede 35','Sede 50'];
async function init(){
  if(!API||API.includes('PEGAR')){app.innerHTML='<p class="empty">Falta configurar la dirección del servidor (archivo config.js).</p>';return}
  try{const d=await rpc('getInicio');Object.assign(S,d);S.url=location.origin+location.pathname}catch(e){app.innerHTML='<p class="empty">No se pudo cargar. Revisá la conexión y recargá.</p>';return}
  S.sedes=ORDEN.filter(x=>S.sedes.includes(x)).concat(S.sedes.filter(x=>!ORDEN.includes(x)));
  try{const g=JSON.parse(ls.get('isft8_doc'));S.doc={id:g.id,nombre:g.nombre};S.tok=g.tok||''}catch(e){}
  if(S.doc&&(!S.tok||!S.docentes.some(d=>d.id===S.doc.id))){S.doc=null;S.tok=''}
  if(S.tok)rpc('validarSesion',S.tok).catch(e=>toast(msg(e)));
  portada();
}
function who(){$('#who').innerHTML=S.doc?`Hola, <b>${esc(S.doc.nombre)}</b><br><button onclick="cambiar()">Salir</button>`:''}
function cambiar(){ls.set('isft8_doc','');S.doc=null;S.tok='';S.sede?ident():portada()}
function portada(){S.sede=null;who();
  app.innerHTML=`<div class="ctr portada"><img src="${LOGO_AZUL}" alt="ISFT 8"><h1>Préstamos y reservas de equipos</h1><p class="sub">Elegí tu sede</p>
  <div class="sedes big">${S.sedes.map(x=>`<button onclick="elegirSede('${x}')">${x}</button>`).join('')}</div>
  <p style="margin-top:26px"><button class="back" onclick="admin()">🔒 Administración</button></p></div>`}
const elegirSede=x=>{S.sede=x;S.doc?home():ident()};
function ident(){who();
  app.innerHTML=`<button class="back" onclick="portada()">← Cambiar sede</button><h2>¿Quién sos?</h2><p class="sub">Elegí tu nombre. Solo te lo pedimos esta vez.</p>
  <input id="q" placeholder="Buscar mi nombre" oninput="filtrar()"><div class="docs" id="lista"></div>`;filtrar()}
function filtrar(){const q=($('#q').value||'').toLowerCase();const l=S.docentes.filter(d=>d.nombre.toLowerCase().includes(q));
  $('#lista').innerHTML=l.length?l.map(d=>`<button onclick="elegir('${d.id}')">${esc(d.nombre)}</button>`).join(''):'<p class="empty">No encontramos ese nombre. Pedile al administrador que te agregue.</p>'}
function elegir(id){S.pend=S.docentes.find(x=>x.id===id);
  app.innerHTML=`<button class="back" onclick="ident()">← Volver</button><h2>Hola, ${esc(S.pend.nombre)}</h2><p class="sub">Ingresá tu contraseña.</p>
  <input type="password" id="clave" autocomplete="current-password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')entrar()"><button class="btn sec" onclick="entrar()">Ingresar</button>`;$('#clave').focus()}
async function entrar(){const c=$('#clave').value;if(!c)return toast('Escribí tu contraseña.');
  try{const r=await rpc('ingresar',S.pend.id,c);S.doc={id:r.id,nombre:r.nombre};S.tok=r.token;ls.set('isft8_doc',JSON.stringify({id:r.id,nombre:r.nombre,tok:r.token}));home()}catch(e){toast(msg(e))}}
function miClave(){app.innerHTML=volver+`<h2>Cambiar mi contraseña</h2><label>Contraseña actual</label><input type="password" id="c0" autocomplete="current-password">
  <label>Contraseña nueva (mínimo 4 caracteres)</label><input type="password" id="c1" autocomplete="new-password"><label>Repetir contraseña nueva</label><input type="password" id="c2" autocomplete="new-password">
  <button class="btn sec" onclick="guardarClave()">Guardar</button>`}
async function guardarClave(){if($('#c1').value!==$('#c2').value)return toast('Las contraseñas nuevas no coinciden.');
  try{const r=await rpc('cambiarClave',S.tok,$('#c0').value,$('#c1').value);S.tok=r.token;ls.set('isft8_doc',JSON.stringify({id:S.doc.id,nombre:S.doc.nombre,tok:S.tok}));toast('Contraseña actualizada',1);home()}catch(e){toast(msg(e))}}
function home(){who();S.sel=new Set();
  app.innerHTML=`<div class="sedebar"><span>📍 <b>${S.sede}</b></span><button class="back" onclick="portada()">Cambiar sede</button></div><h2>¿Qué querés hacer?</h2>
  <div class="tiles">
  <button class="tile" onclick="pedir()"><span class="ic">🙋</span>Retirar</button>
  <button class="tile" onclick="devolver()"><span class="ic">↩️</span>Devolver</button>
  <button class="tile" onclick="reservar()"><span class="ic">📅</span>Reservar</button>
  <button class="tile" onclick="mis()"><span class="ic">📋</span>Mis reservas</button></div>
  <p class="ctr" style="margin-top:22px"><button class="back" onclick="miClave()">🔑 Cambiar mi contraseña</button></p>`}
const volver='<button class="back" onclick="home()">← Volver al inicio</button>';
function grid(list,modo){return list.length?`<div class="grid">${list.map(e=>`<button class="eq" id="e${e.id}" ${modo==='pedir'&&e.enUsoPor?'disabled':''} onclick="tog('${e.id}')"><span class="ic">${ic(e)}</span><b>${esc(e.nombre)}</b>${modo==='pedir'&&e.enUsoPor?`<small>En uso: ${esc(e.enUsoPor)}</small>`:''}</button>`).join('')}</div>`:'<p class="empty">No hay equipos cargados en esta sede.</p>'}
function tog(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);$('#e'+id).classList.toggle('sel');const b=$('#go');if(b){b.disabled=!S.sel.size;b.textContent=S.sel.size?b.dataset.t.replace('N',S.sel.size):'Elegí un equipo'}}
const barra=t=>`<div class="bar"><button class="btn" id="go" data-t="${t}" disabled onclick="enviar()">Elegí un equipo</button></div>`;

const HORAS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')),MINS=Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));
const tsel=(id,h)=>`<div class="tsel"><select id="${id}h">${HORAS.map(x=>`<option${x===h?' selected':''}>${x}</option>`).join('')}</select><b>:</b><select id="${id}m">${MINS.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
const hora=id=>$('#'+id+'h').value+':'+$('#'+id+'m').value;
async function pedir(){S.modo='pedir';S.sel=new Set();app.innerHTML=volver+`<h2>Retirar equipo · ${S.sede}</h2><p class="empty">Cargando…</p>`;
  try{const l=await rpc('getEquipos',S.sede);app.innerHTML=volver+`<h2>¿Qué equipo necesitás? <small style="color:var(--mut);font-weight:600">${S.sede}</small></h2>`+grid(l,'pedir')+barra('Retirar N seleccionado(s)')}catch(e){toast(msg(e))}}
async function reservar(){S.modo='reservar';S.sel=new Set();app.innerHTML=volver+`<h2>Reservar · ${S.sede}</h2><p class="empty">Cargando…</p>`;
  try{const l=await rpc('getEquipos',S.sede);app.innerHTML=volver+`<h2>Reservar equipo <small style="color:var(--mut);font-weight:600">${S.sede}</small></h2>
  <label>Día</label><input type="date" id="f" min="${hoy()}" value="${hoy()}"><div class="row2"><div><label>Desde (hs)</label>${tsel('i','08')}</div><div><label>Hasta (hs)</label>${tsel('h','09')}</div></div>
  <label>Equipos</label>`+grid(l,'reservar')+barra('Reservar N seleccionado(s)')}catch(e){toast(msg(e))}}
function enviar(){const ids=[...S.sel];if(!ids.length)return;
  if(S.modo==='pedir')run(rpc('prestar',S.sede,S.tok,ids),'Listo, quedó registrado. ¡Buena clase!',home);
  else run(rpc('reservar',S.sede,S.tok,$('#f').value,hora('i'),hora('h'),ids),'Reserva confirmada',home)}

async function devolver(){S.sel=new Set();S.modo='dev';app.innerHTML=volver+'<p class="empty">Cargando…</p>';
  try{const l=await rpc('getMisPrestamos',S.tok);app.innerHTML=volver+'<h2>Equipos que tenés prestados</h2>'+(l.length?`<div class="grid">${l.map(p=>`<button class="eq" id="e${p.id}" onclick="tog('${p.id}')"><span class="ic">↩️</span><b>${esc(p.equipo)}</b><small>${p.sede} · ${fmt(p.retiro)}</small></button>`).join('')}</div>`+barra('Devolver N seleccionado(s)'):'<p class="empty">No tenés equipos pendientes de devolución. 👍</p>');
  if(l.length)$('#go').onclick=()=>run(rpc('devolver',S.tok,[...S.sel]),'Devolución registrada. ¡Gracias!',home)}catch(e){toast(msg(e))}}

async function mis(){app.innerHTML=volver+'<p class="empty">Cargando…</p>';
  try{const l=await rpc('getMisReservas',S.tok);app.innerHTML=volver+'<h2>Mis reservas</h2>'+(l.length?l.map(r=>`<div class="card"><b>${esc(r.equipo)}</b><div class="m">${r.sede} · ${r.fecha.split('-').reverse().join('/')} de ${r.inicio} a ${r.fin}</div>
  <button class="btn small" onclick="retirar('${r.id}')">Retirar ahora</button><button class="btn small ghost" onclick="cancelar('${r.id}')">Cancelar</button></div>`).join(''):'<p class="empty">No tenés reservas próximas.</p>')}catch(e){toast(msg(e))}}
const retirar=id=>run(rpc('retirarReserva',S.tok,id),'Equipo retirado. Quedó registrado.',mis);
const cancelar=id=>confirm('¿Cancelar esta reserva?')&&run(rpc('cancelarReserva',S.tok,id),'Reserva cancelada',mis);

/* ---------- administración ---------- */
function admin(){who();S.pin?adminVista():app.innerHTML=`<button class="back" onclick="portada()">← Volver</button><h2>Administración</h2><label>PIN de administrador</label><input type="password" id="pin" inputmode="numeric"><button class="btn sec" onclick="login()">Entrar</button>`}
async function login(){const p=$('#pin').value;try{await rpc('adminLogin',p);S.pin=p;adminVista()}catch(e){toast(msg(e))}}
async function adminVista(){const t=S.tab;
  app.innerHTML=`<button class="back" onclick="S.pin='';portada()">← Salir de administración</button><h2>Administración</h2>
  <div class="tabs">${[...Object.keys(ADM),'Informes','QR'].map(x=>`<button class="${x===t?'on':''}" onclick="S.tab='${x}';adminVista()">${x==='Prestamos'?'Préstamos':x}</button>`).join('')}</div><div id="adm"><p class="empty">Cargando…</p></div>`;
  if(t==='QR'){$('#adm').innerHTML=`<div class="card ctr"><div id="qr" style="display:inline-block;padding:12px;background:#fff"></div><p class="m">Imprimilo y pegalo donde se guardan los equipos.<br>${esc(S.url)}</p></div>`;new QRCode($('#qr'),{text:S.url,width:260,height:260,correctLevel:QRCode.CorrectLevel.H});return}
  if(t==='Informes')return informes();
  try{S.rows=await rpc('adminLista',S.pin,t);S.q='';listar()}catch(e){toast(msg(e))}}
function listar(){const t=S.tab,q=(S.q||'').toLowerCase();const l=S.rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  if(!$('#lst'))$('#adm').innerHTML=`<input placeholder="Buscar" oninput="S.q=this.value;listar()">`+(t==='Docentes'||t==='Equipos'?`<button class="btn sec" style="margin-bottom:12px" onclick="editar('')">+ Agregar</button>`:'')+'<div id="lst"></div>';
  $('#lst').innerHTML=(l.length?l.map(r=>`<div class="card"><b>${esc(r.nombre||r.equipo)}</b><div class="m">${ADM[t].filter(c=>c!=='nombre'&&!(c==='equipo'&&!r.nombre)).map(c=>`${c}: ${esc(r[c]||'—')}`).join(' · ')}</div>
  <button class="btn small ghost" onclick="editar('${r.id}')">Editar</button><button class="btn small" onclick="borrar('${r.id}')">Eliminar</button></div>`).join(''):'<p class="empty">Sin registros.</p>')}
function editar(id){const t=S.tab,o=S.rows.find(r=>r.id===id)||{activo:'Sí',sede:S.sedes[0],tipo:'otro'};
  const opt={sede:S.sedes,tipo:TIPOS,activo:['Sí','No'],estado:t==='Prestamos'?['Prestado','Devuelto']:['Activa','Retirada','Cancelada']};
  $('#adm').innerHTML=`<h2>${id?'Editar':'Agregar'} registro</h2>`+ADM[t].map(c=>`<label>${c==='clave'?'contraseña (vacío = no cambiarla)':c}</label>`+(opt[c]?`<select id="f_${c}">${opt[c].map(v=>`<option value="${v}" ${v===o[c]?'selected':''}>${c==='tipo'?(ICONOS[v]||'')+' ':''}${v}</option>`).join('')}</select>`:`<input id="f_${c}" value="${c==='clave'?'':esc(o[c]||'')}">`)).join('')+
  `<button class="btn sec" onclick="guardar('${id}')">Guardar</button><br><button class="btn ghost" onclick="adminVista()">Cancelar</button>`;autoTipo(t)}
function guardar(id){const o=Object.assign({},S.rows.find(r=>r.id===id)||{});ADM[S.tab].forEach(c=>o[c]=$('#f_'+c).value.trim());
  if(!(o.nombre||o.equipo))return toast('Completá el nombre.');run(rpc('adminGuardar',S.pin,S.tab,o),'Guardado',adminVista)}
const borrar=id=>confirm('¿Eliminar este registro? No se puede deshacer.')&&run(rpc('adminEliminar',S.pin,S.tab,id),'Eliminado',adminVista);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function autoTipo(t){if(t!=='Equipos')return;const n=$('#f_nombre'),x=$('#f_tipo');n.oninput=()=>{if(x.value==='otro'||x.dataset.a){const g=adivinar(n.value);x.value=g||'otro';x.dataset.a=g?'1':''}}}

/* ---------- informes en Excel ---------- */
const INF=[['prestados','Equipos prestados ahora'],['historial','Historial de préstamos'],['reservas','Reservas'],['docentes','Resumen por docente'],['equipos','Resumen por equipo'],['todo','Informe completo (todas las hojas)']];
function informes(){$('#adm').innerHTML=`<div class="card"><label>Tipo de informe</label><select id="rt">${INF.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join('')}</select>
  <label>Sede</label><select id="rs"><option value="">Todas</option>${S.sedes.map(x=>`<option>${x}</option>`).join('')}</select>
  <label>Docente</label><select id="rdoc"><option value="">Todos</option>${S.docentes.map(d=>`<option>${esc(d.nombre)}</option>`).join('')}</select>
  <div class="row2"><div><label>Desde (fecha)</label><input type="date" id="rd"></div><div><label>Hasta (fecha)</label><input type="date" id="rh"></div></div>
  <button class="btn sec" onclick="descargar()">⬇️ Descargar Excel</button></div>
  <p class="m" style="color:var(--mut)">Las fechas filtran por día de retiro (préstamos) o día reservado (reservas). Dejalas vacías para incluir todo.</p>`}
const dur=(a,b)=>{const m=Math.round((new Date(b.replace(' ','T'))-new Date(a.replace(' ','T')))/6e4);return isNaN(m)||m<0?'':Math.floor(m/60)+' h '+m%60+' min'};
function hoja(rows,cols){const ws=XLSX.utils.aoa_to_sheet([cols.map(c=>c[0]),...rows.map(r=>cols.map(c=>r[c[1]]))]);
  ws['!cols']=cols.map(c=>({wch:Math.min(42,Math.max(c[0].length,...rows.map(r=>String(r[c[1]]==null?'':r[c[1]]).length))+2)}));return ws}
async function descargar(){
  if(typeof XLSX==='undefined')return toast('No se pudo cargar el generador de Excel. Revisá tu internet y recargá.');
  const tipo=$('#rt').value,sede=$('#rs').value,doc=$('#rdoc').value,d1=$('#rd').value,d2=$('#rh').value;
  try{
    const [P,R,E]=await Promise.all(['Prestamos','Reservas','Equipos'].map(t=>rpc('adminLista',S.pin,t)));
    const ok=(r,f)=>(!sede||r.sede===sede)&&(!doc||r.docente===doc)&&(!d1||f>=d1)&&(!d2||f<=d2);
    const p=P.filter(r=>ok(r,r.retiro.slice(0,10))).map(r=>Object.assign({},r,{dur:r.devolucion?dur(r.retiro,r.devolucion):''})),rv=R.filter(r=>ok(r,r.fecha));
    const dd={},g=n=>dd[n]||(dd[n]={docente:n,pres:0,pend:0,res:0,can:0});
    p.forEach(r=>{const x=g(r.docente);x.pres++;if(r.estado==='Prestado')x.pend++});rv.forEach(r=>{const x=g(r.docente);x.res++;if(r.estado==='Cancelada')x.can++});
    const ab={};P.filter(r=>r.estado==='Prestado').forEach(r=>ab[r.equipoId]=r.docente);
    const eq=E.filter(e=>!sede||e.sede===sede).map(e=>({sede:e.sede,nombre:e.nombre,tipo:e.tipo,activo:e.activo,estado:ab[e.id]?'Prestado a '+ab[e.id]:'Disponible',veces:p.filter(r=>r.equipoId===e.id).length,res:rv.filter(r=>r.equipoId===e.id).length}));
    const H={prestados:['Prestados ahora',p.filter(r=>r.estado==='Prestado'),[['Sede','sede'],['Equipo','equipo'],['Docente','docente'],['Retiro','retiro']]],
      historial:['Historial de préstamos',p,[['Sede','sede'],['Equipo','equipo'],['Docente','docente'],['Retiro','retiro'],['Devolución','devolucion'],['Estado','estado'],['Duración','dur']]],
      reservas:['Reservas',rv,[['Sede','sede'],['Fecha','fecha'],['Desde','inicio'],['Hasta','fin'],['Equipo','equipo'],['Docente','docente'],['Estado','estado']]],
      docentes:['Por docente',Object.values(dd).sort((a,b)=>a.docente.localeCompare(b.docente)),[['Docente','docente'],['Préstamos','pres'],['Sin devolver','pend'],['Reservas','res'],['Reservas canceladas','can']]],
      equipos:['Por equipo',eq,[['Sede','sede'],['Equipo','nombre'],['Tipo','tipo'],['Activo','activo'],['Estado actual','estado'],['Veces prestado','veces'],['Reservas','res']]]};
    if(tipo!=='todo'&&!H[tipo][1].length)return toast('No hay registros con esos filtros.');
    const wb=XLSX.utils.book_new();(tipo==='todo'?Object.keys(H):[tipo]).forEach(k=>XLSX.utils.book_append_sheet(wb,hoja(H[k][1],H[k][2]),H[k][0]));
    XLSX.writeFile(wb,'ISFT8_'+INF.find(i=>i[0]===tipo)[1].split(' (')[0].replace(/\s+/g,'_')+'_'+hoy()+'.xlsx');toast('Informe descargado',1);
  }catch(e){toast(msg(e))}}

init();
</script></body></html>
